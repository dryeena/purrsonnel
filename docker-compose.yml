services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: purrsonnel
      POSTGRES_PASSWORD: purrsonnel_dev_only
      POSTGRES_DB: purrsonnel
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purrsonnel"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./apps/api
    environment:
      APP_ENV: development
      DEV_AUTH_ENABLED: "true"
      DEV_AUTH_DEFAULT_USER: dev.hr@purrsonnel.local
      DATABASE_URL: postgres://purrsonnel:purrsonnel_dev_only@db:5432/purrsonnel
      API_BIND: 0.0.0.0:3000
      APP_PUBLIC_ORIGIN: http://localhost:${WEB_PORT:-5173}
      MAX_VOLUNTEER_MINUTES: ${MAX_VOLUNTEER_MINUTES:-960}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      RUST_LOG: purrsonnel_api=info,tower_http=info
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: ./apps/web
      target: development
    environment:
      API_PROXY_TARGET: http://api:3000
    ports: ["127.0.0.1:${WEB_PORT:-5173}:5173"]
    depends_on: [api]
volumes:
  postgres_data:
